<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>本地縮時攝影影片生成器</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css" />
    <style>
      /* Simple.css 未內建：載入中旋轉圖示 */
      .spinner {
        border: 4px solid var(--border);
        border-top: 4px solid var(--accent);
        border-radius: 50%;
        width: 36px;
        height: 36px;
        animation: spin 1s linear infinite;
        display: none;
        margin: 1rem auto;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #video-container {
        display: none;
        margin-top: 2rem;
      }

      #status-text.error {
        color: var(--accent);
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>本地縮時攝影影片生成器</h1>
      <details open>
        <summary><strong>使用步驟</strong></summary>
        <ol>
          <li>選擇圖片檔案或資料夾。</li>
          <li>設定您希望的排序規則。</li>
          <li>設定影片幀率 (FPS)。</li>
          <li>點擊「生成影片」按鈕。</li>
        </ol>
        <p>
          <small>
            <strong>偵錯提示：</strong>
            若遇到問題，請按下
            <kbd>F12</kbd>
            打開開發者工具，查看「Console」(主控台) 中的詳細日誌訊息。
          </small>
        </p>
      </details>

      <form id="timelapse-form">
        <fieldset>
          <legend>1. 選擇圖片</legend>
          <label for="image-files">選擇多個圖片檔案</label>
          <input type="file" id="image-files" multiple accept="image/*" />
          <label for="image-directory">或者，選擇整個資料夾</label>
          <input type="file" id="image-directory" webkitdirectory directory />
        </fieldset>

        <fieldset>
          <legend>2. 設定排序規則</legend>
          <label for="sort-criteria">排序依據</label>
          <select id="sort-criteria">
            <option value="name" selected>按檔案名稱</option>
            <option value="date">按修改日期</option>
          </select>
          <label for="sort-direction">排序方向</label>
          <select id="sort-direction">
            <option value="asc" selected>遞增 (A-Z, 早到晚)</option>
            <option value="desc">遞減 (Z-A, 晚到早)</option>
          </select>
        </fieldset>

        <fieldset>
          <legend>3. 影片設定</legend>
          <label for="fps">影片幀率 (FPS)</label>
          <input type="number" id="fps" value="24" min="1" max="120" />
        </fieldset>

        <button id="generate-btn" type="button" disabled>生成影片</button>
      </form>

      <section id="status" aria-live="polite">
        <p id="status-text">請先選擇圖片檔案或資料夾。</p>
        <div class="spinner" id="spinner"></div>
        <progress id="progress" value="0" max="100" hidden>0%</progress>
      </section>

      <section id="video-container">
        <h2>生成結果</h2>
        <video id="output-video" controls></video>
        <a id="download-link" href="#" download="timelapse.webm">⬇ 下載影片 (.webm)</a>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const imageFilesInput = $("image-files");
      const imageDirectoryInput = $("image-directory");
      const sortCriteriaSelect = $("sort-criteria");
      const sortDirectionSelect = $("sort-direction");
      const fpsInput = $("fps");
      const generateBtn = $("generate-btn");
      const statusText = $("status-text");
      const spinner = $("spinner");
      const progress = $("progress");
      const videoContainer = $("video-container");
      const outputVideo = $("output-video");
      const downloadLink = $("download-link");
      let imageFiles = [];

      const setStatus = (text, isError = false) => {
        statusText.textContent = text;
        statusText.classList.toggle("error", isError);
      };

      const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      const loadImage = (file) =>
        new Promise((resolve, reject) => {
          const img = new Image();
          const reader = new FileReader();
          reader.onload = (e) => {
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error(`無法載入圖片: ${file.name}`));
            img.src = e.target.result;
          };
          reader.onerror = () => reject(new Error(`無法讀取檔案: ${file.name}`));
          reader.readAsDataURL(file);
        });

      function sortFiles() {
        const { value: criteria } = sortCriteriaSelect;
        const { value: direction } = sortDirectionSelect;
        const compare = (a, b) => {
          if (criteria === "name") {
            // 自然排序，能正確處理 'img2' 和 'img10'
            return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" });
          }
          // 'date': File.lastModified 是時間戳 (數字)
          return a.lastModified - b.lastModified;
        };
        imageFiles.sort((a, b) => (direction === "asc" ? compare(a, b) : -compare(a, b)));
        console.log(`排序完成: ${imageFiles[0].name} → ${imageFiles[imageFiles.length - 1].name}`);
        setStatus(`已重新排序 ${imageFiles.length} 張圖片。準備就緒。`);
      }

      function handleFileSelection() {
        const allFiles = [...imageFilesInput.files, ...imageDirectoryInput.files];
        imageFiles = allFiles.filter((file) => file.type.startsWith("image/"));
        console.log(`選取 ${allFiles.length} 個檔案，其中 ${imageFiles.length} 張為有效圖片。`);
        videoContainer.style.display = "none";
        if (imageFiles.length > 0) {
          sortFiles();
          generateBtn.disabled = false;
        } else {
          setStatus("未選擇任何有效的圖片檔案。請確認檔案格式。", true);
          generateBtn.disabled = true;
        }
      }

      function enableControls(enable) {
        [
          imageFilesInput,
          imageDirectoryInput,
          sortCriteriaSelect,
          sortDirectionSelect,
          fpsInput,
          generateBtn,
        ].forEach((el) => {
          el.disabled = !enable;
        });
      }

      imageFilesInput.addEventListener("change", handleFileSelection);
      imageDirectoryInput.addEventListener("change", handleFileSelection);
      sortCriteriaSelect.addEventListener("change", sortFiles);
      sortDirectionSelect.addEventListener("change", sortFiles);

      generateBtn.addEventListener("click", async () => {
        if (imageFiles.length === 0) {
          setStatus("請先選擇圖片！", true);
          return;
        }
        enableControls(false);
        spinner.style.display = "block";
        progress.hidden = false;
        progress.value = 0;
        videoContainer.style.display = "none";
        setStatus("正在初始化...");

        try {
          const fps = Number.parseInt(fpsInput.value, 10);
          if (Number.isNaN(fps) || fps < 1) {
            throw new Error("無效的 FPS 值。請輸入大於 0 的數字。");
          }

          // 步驟 1/4：以第一張圖決定影片尺寸
          setStatus("步驟 1/4: 讀取圖片尺寸...");
          const { naturalWidth: width, naturalHeight: height } = await loadImage(imageFiles[0]);
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");

          // 步驟 2/4：設定影片編碼器
          setStatus("步驟 2/4: 設定影片編碼器...");
          const mimeType = "video/webm; codecs=vp9";
          if (!MediaRecorder.isTypeSupported(mimeType)) {
            throw new Error(`瀏覽器不支援 ${mimeType} 編碼格式。`);
          }
          const recorder = new MediaRecorder(canvas.captureStream(), {
            mimeType,
            videoBitsPerSecond: 8_000_000,
          });
          const chunks = [];
          recorder.ondataavailable = (event) => {
            if (event.data.size > 0) chunks.push(event.data);
          };
          recorder.onstop = () => {
            const videoBlob = new Blob(chunks, { type: "video/webm" });
            const videoUrl = URL.createObjectURL(videoBlob);
            outputVideo.src = videoUrl;
            downloadLink.href = videoUrl;
            videoContainer.style.display = "block";
            spinner.style.display = "none";
            setStatus(`處理完成！成功生成了包含 ${imageFiles.length} 幀的影片。`);
            enableControls(true);
          };

          // 步驟 3/4：逐幀繪製
          recorder.start();
          setStatus("步驟 3/4: 處理圖片幀...");
          const frameDelay = 1000 / fps;
          for (const [i, file] of imageFiles.entries()) {
            setStatus(`步驟 3/4: 正在處理第 ${i + 1} / ${imageFiles.length} 張圖片...`);
            progress.value = Math.round(((i + 1) / imageFiles.length) * 100);
            const image = await loadImage(file);
            ctx.drawImage(image, 0, 0, width, height);
            await delay(frameDelay);
          }

          // 步驟 4/4：停止編碼器並合成影片
          setStatus("步驟 4/4: 合成影片檔案...");
          recorder.stop();
        } catch (error) {
          console.error("生成影片時發生錯誤:", error);
          setStatus(`發生錯誤: ${error.message} (詳情請見主控台 F12)`, true);
          spinner.style.display = "none";
          progress.hidden = true;
          enableControls(true);
        }
      });
    </script>
  </body>
</html>
